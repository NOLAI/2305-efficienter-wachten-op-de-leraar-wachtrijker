[project]
name = "wachtrijker"
version = "0.1.0"
description = "Django app used by students to formulate a good help-desk question before it is forwarded to a teacher."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.8.1",
    "Django==5.2.3",
    "keyring",
    "matplotlib",
    "pandas",
    "requests",
    "shap",
    "sqlparse==0.5.3",
    "thefuzz",
    "torch",
    "transformers",
    "scikit-learn",
    "datasets>=5.0.0",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "pre-commit==4.2.0",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is enforced by black instead
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E", "F401"]
